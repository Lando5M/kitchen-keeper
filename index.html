<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kitchen Keeper</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7f5;color:#17221b}
button,input,select,textarea{font:inherit}button{cursor:pointer}
header{padding:24px;background:#183b29;color:white}h1{margin:0 0 6px}.wrap{max-width:1050px;margin:auto;padding:24px}
.auth{max-width:430px;margin:50px auto;background:white;padding:28px;border-radius:16px;box-shadow:0 8px 30px #0001}
.tabs{display:flex;gap:8px;margin-bottom:20px}.tabs button{flex:1;padding:12px;border:0;border-radius:9px;background:#e8eee9}.tabs button.active{background:#2f7d4b;color:white}
input,select,textarea{width:100%;padding:11px;border:1px solid #ccd6ce;border-radius:8px;margin:6px 0 14px;background:white}
.primary{background:#2f7d4b;color:white;border:0;padding:12px 18px;border-radius:9px}.secondary{background:#e8eee9;border:0;padding:12px 18px;border-radius:9px}
.msg{min-height:22px;margin:8px 0;color:#b42318}.hidden{display:none!important}
.appnav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.appnav button{border:0;padding:10px 14px;border-radius:8px;background:#e8eee9}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:white;padding:18px;border-radius:12px}.card b{font-size:28px}
.panel{background:white;padding:20px;border-radius:14px;margin-top:18px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.food{padding:14px 0;border-bottom:1px solid #e4e9e5}
@media(max-width:700px){.cards{grid-template-columns:repeat(2,1fr)}.wrap{padding:15px}}
</style>
</head>
<body>
<header><div class="wrap"><h1>🥕 Kitchen Keeper</h1><div>Shared household food inventory</div></div></header>

<section id="auth" class="auth">
  <div class="tabs">
    <button id="signInTab" class="active" type="button">Sign in</button>
    <button id="signUpTab" type="button">Create account</button>
  </div>
  <form id="authForm">
    <label>Email</label>
    <input id="email" type="email" required autocomplete="email">
    <label>Password</label>
    <input id="password" type="password" required minlength="6" autocomplete="current-password">
    <button id="authButton" class="primary" type="submit">Sign in</button>
  </form>
  <div id="authMsg" class="msg"></div>
</section>

<section id="app" class="wrap hidden">
  <div class="row">
    <h2>Kitchen Keeper</h2>
    <button id="signOut" class="secondary" type="button">Sign out</button>
  </div>
  <div class="appnav">
    <button id="navDashboard" type="button" onclick="window.showKitchenView('dashboard')">Dashboard</button>
    <button id="navInventory" type="button" onclick="window.showKitchenView('inventoryView')">Inventory</button>
    <button id="navAlerts" type="button" onclick="window.showKitchenView('alertsView')">Alerts</button>
    <button id="navSettings" type="button" onclick="window.showKitchenView('settingsView')">Settings</button>
  </div>
  <div id="householdSetup" class="panel">
    <h2>Set up your household</h2>
    <p>Create a household or join one with an invite code.</p>
    <label>Household name</label><input id="houseName" value="My Kitchen">
    <button id="createHouse" class="primary" type="button">Create household</button>
    <hr>
    <label>Invite code</label><input id="inviteCode" maxlength="8" placeholder="8-character code">
    <button id="joinHouse" class="secondary" type="button">Join household</button>
    <div id="houseMsg" class="msg"></div>
  </div>
  <div id="dashboard" class="hidden">
    <div class="cards">
      <div class="card">Total items<br><b id="total">0</b></div>
      <div class="card">Low stock<br><b id="low">0</b></div>
      <div class="card">Expiring soon<br><b id="soon">0</b></div>
      <div class="card">Expired<br><b id="expired">0</b></div>
    </div>
    <div class="panel">
      <div class="row"><h2>Inventory</h2><button id="addFood" class="primary" type="button">＋ Add food</button></div>
      <div id="inventory"></div>
    </div>
  </div>

  <div id="inventoryView" class="hidden">
    <div class="panel">
      <div class="row"><h2>Inventory</h2><button id="addFood2" class="primary" type="button">＋ Add food</button></div>
      <div id="inventoryList"></div>
    </div>
  </div>

  <div id="alertsView" class="hidden">
    <div class="panel"><h2>Alerts</h2><div id="alertsList"></div></div>
  </div>

  <div id="settingsView" class="hidden">
    <div class="panel">
      <h2>Settings</h2>
      <p><b>Household</b></p>
      <p id="householdInfo">Your shared household is connected.</p>
      <button id="refreshApp" class="secondary" type="button">Refresh inventory</button>
    </div>
  </div>
    <div id="foodModal" class="auth hidden" style="position:fixed;inset:0;max-width:none;margin:0;background:#0008;border-radius:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px">
      <div style="background:white;max-width:620px;width:100%;max-height:92vh;overflow:auto;border-radius:16px;padding:24px">
        <div class="row"><h2 style="margin-top:0">Add food</h2><button id="closeFood" class="secondary" type="button">Close</button></div>
        <form id="foodForm">
          <label>Food name *</label>
          <input id="foodName" required placeholder="e.g. Milk">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
            <div><label>Brand</label><input id="foodBrand" placeholder="Optional"></div>
            <div><label>Category</label><select id="foodCategory"><option>Produce</option><option>Dairy</option><option>Meat</option><option>Frozen</option><option>Pantry</option><option>Bakery</option><option>Beverages</option><option>Snacks</option><option>Other</option></select></div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
            <div><label>Quantity *</label><input id="foodQty" type="number" min="0" step="0.01" value="1" required></div>
            <div><label>Unit</label><select id="foodUnit"><option>each</option><option>package</option><option>can</option><option>bottle</option><option>bag</option><option>box</option><option>lb</option><option>oz</option><option>g</option><option>kg</option><option>gallon</option><option>quart</option><option>pint</option></select></div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
            <div><label>Low-stock alert at</label><input id="foodLow" type="number" min="0" step="0.01" value="1"></div>
            <div><label>Expiration date</label><input id="foodExpiration" type="date"></div>
          </div>
          <label>Location</label>
          <select id="foodLocation"><option>Pantry</option><option>Refrigerator</option><option>Freezer</option><option>Counter</option><option>Other</option></select>
          <label>Notes</label>
          <textarea id="foodNotes" rows="3" placeholder="Optional notes"></textarea>
          <div id="foodMsg" class="msg"></div>
          <button class="primary" type="submit">Save food</button>
        </form>
      </div>
    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  "use strict";

  var SUPABASE_URL = "https://gprlzbgcpsmqofpjyase.supabase.co";
  var SUPABASE_KEY = "sb_publishable__4rtFjMMNlRD8D5UY7LSGQ_njJd9G-x";
  var sb = null;
  var mode = "signin";

  var $ = function (id) { return document.getElementById(id); };

  function setMode(next) {
    mode = next;
    $("signInTab").classList.toggle("active", mode === "signin");
    $("signUpTab").classList.toggle("active", mode === "signup");
    $("authButton").textContent = mode === "signin" ? "Sign in" : "Create account";
    $("authMsg").textContent = "";
  }

  $("signInTab").addEventListener("click", function () { setMode("signin"); });
  $("signUpTab").addEventListener("click", function () { setMode("signup"); });

  function showMessage(text) {
    $("authMsg").textContent = text;
  }

  async function start() {
    if (!window.supabase) {
      showMessage("The authentication library did not load. Please refresh the page.");
      return;
    }
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    var result = await sb.auth.getSession();
    if (result.data && result.data.session) {
      showApp();
    }
  }

  $("authForm").addEventListener("submit", async function (event) {
    event.preventDefault();
    if (!sb) {
      showMessage("Connecting to authentication. Please wait a moment and try again.");
      await start();
      if (!sb) return;
    }

    var email = $("email").value.trim();
    var password = $("password").value;
    $("authButton").disabled = true;
    showMessage("Please wait...");

    var result;
    if (mode === "signup") {
      result = await sb.auth.signUp({ email: email, password: password });
    } else {
      result = await sb.auth.signInWithPassword({ email: email, password: password });
    }

    $("authButton").disabled = false;

    if (result.error) {
      showMessage(result.error.message);
      return;
    }

    if (mode === "signup" && !result.data.session) {
      showMessage("Account created. Check your email to confirm your account.");
      return;
    }

    showMessage("");
    showApp();
  });

  $("signOut").addEventListener("click", async function () {
    if (sb) await sb.auth.signOut();
    $("app").classList.add("hidden");
    $("auth").classList.remove("hidden");
  });

  async function showApp() {
    $("auth").classList.add("hidden");
    $("app").classList.remove("hidden");
    await checkHousehold();
  }

  async function checkHousehold() {
    if (!sb) return;
    var result = await sb.from("household_members").select("household_id").limit(1);
    if (result.error || !result.data || result.data.length === 0) {
      $("householdSetup").classList.remove("hidden");
      $("dashboard").classList.add("hidden");
      return;
    }
    $("householdSetup").classList.add("hidden");
    $("dashboard").classList.remove("hidden");
    showView("dashboard");
    $("householdInfo").textContent = "Household ID: " + result.data[0].household_id;
    await loadFood(result.data[0].household_id);
  }

  $("createHouse").addEventListener("click", async function () {
    if (!sb) return;
    var name = $("houseName").value.trim() || "My Kitchen";
    var result = await sb.rpc("create_household", { hname: name });
    if (result.error) {
      $("houseMsg").textContent = result.error.message;
      return;
    }
    $("houseMsg").textContent = "Household created.";
    await checkHousehold();
  });

  $("joinHouse").addEventListener("click", async function () {
    if (!sb) return;
    var code = $("inviteCode").value.trim();
    var result = await sb.rpc("join_household", { invite: code });
    if (result.error) {
      $("houseMsg").textContent = result.error.message;
      return;
    }
    $("houseMsg").textContent = "Joined household.";
    await checkHousehold();
  });

  var currentHouseholdId = null;

  var currentItems = [];

  window.showKitchenView = function (view) {
    ["dashboard", "inventoryView", "alertsView", "settingsView"].forEach(function (id) {
      var el = $(id);
      if (el) el.classList.toggle("hidden", id !== view);
    });
    window.scrollTo(0, 0);
  };

  function showView(view) {
    ["dashboard", "inventoryView", "alertsView", "settingsView"].forEach(function (id) {
      $(id).classList.toggle("hidden", id !== view);
    });
  }

  function openFoodModal() {
    $("foodMsg").textContent = "";
    $("foodModal").classList.remove("hidden");
    $("foodName").focus();
  }

  function formatDate(value) {
    if (!value) return "No expiration date";
    var d = new Date(value + "T00:00:00");
    return d.toLocaleDateString();
  }

  function isExpired(x, today) {
    return x.expiration && new Date(x.expiration + "T23:59:59") < today;
  }

  function isSoon(x, today, soonDate) {
    if (!x.expiration) return false;
    var d = new Date(x.expiration + "T00:00:00");
    return d >= today && d <= soonDate;
  }

  function itemHtml(x, today, soonDate) {
    var low = Number(x.quantity) <= Number(x.low_at);
    var expired = isExpired(x, today);
    var soon = isSoon(x, today, soonDate);
    var flags = [];
    if (low) flags.push("⚠️ Low stock");
    if (expired) flags.push("🔴 Expired");
    else if (soon) flags.push("🟡 Expiring soon");
    return '<div class="food"><div><b>' + escapeHtml(x.name) + '</b>' +
      (flags.length ? ' <span>' + escapeHtml(flags.join(" · ")) + '</span>' : '') +
      '<br><small>' + escapeHtml(x.brand || "") + (x.brand ? " · " : "") +
      escapeHtml(x.quantity) + " " + escapeHtml(x.unit || "") + " · " +
      escapeHtml(x.location || "") + " · " + escapeHtml(x.category || "") +
      (x.expiration ? " · expires " + escapeHtml(formatDate(x.expiration)) : "") +
      '</small></div>' + (x.notes ? '<small>' + escapeHtml(x.notes) + '</small>' : '') + '</div>';
  }

  function renderViews() {
    var items = currentItems;
    var today = new Date();
    var soonDate = new Date();
    soonDate.setHours(23, 59, 59, 999);
    soonDate.setDate(today.getDate() + 7);

    var lowItems = items.filter(function (x) { return Number(x.quantity) <= Number(x.low_at); });
    var expiredItems = items.filter(function (x) { return isExpired(x, today); });
    var soonItems = items.filter(function (x) { return isSoon(x, today, soonDate); });

    $("total").textContent = items.length;
    $("low").textContent = lowItems.length;
    $("soon").textContent = soonItems.length;
    $("expired").textContent = expiredItems.length;

    var allHtml = items.length ? items.map(function (x) { return itemHtml(x, today, soonDate); }).join("") : '<p>Your inventory is empty. Click <b>＋ Add food</b> to add your first item.</p>';
    $("inventory").innerHTML = allHtml;
    $("inventoryList").innerHTML = allHtml;

    var alerts = [];
    lowItems.forEach(function (x) { alerts.push('<div class="food"><b>⚠️ Low stock: ' + escapeHtml(x.name) + '</b><br><small>' + escapeHtml(x.quantity) + ' ' + escapeHtml(x.unit || "") + ' remaining (alert at ' + escapeHtml(x.low_at) + ')</small></div>'); });
    expiredItems.forEach(function (x) { alerts.push('<div class="food"><b>🔴 Expired: ' + escapeHtml(x.name) + '</b><br><small>Expired ' + escapeHtml(formatDate(x.expiration)) + '</small></div>'); });
    soonItems.filter(function (x) { return !isExpired(x, today); }).forEach(function (x) { alerts.push('<div class="food"><b>🟡 Expiring soon: ' + escapeHtml(x.name) + '</b><br><small>Expires ' + escapeHtml(formatDate(x.expiration)) + '</small></div>'); });
    $("alertsList").innerHTML = alerts.length ? alerts.join("") : '<p>No active alerts. Everything looks good!</p>';
  }

  async function loadFood(householdId) {
    currentHouseholdId = householdId;
    var result = await sb.from("food_items").select("*").eq("household_id", householdId).order("expiration", { ascending: true });
    if (result.error) {
      $("inventory").innerHTML = "<p>" + escapeHtml(result.error.message) + "</p>";
      $("inventoryList").innerHTML = "<p>" + escapeHtml(result.error.message) + "</p>";
      return;
    }
    currentItems = result.data || [];
    renderViews();
  }

  $("navDashboard").addEventListener("click", function () { showView("dashboard"); });
  $("navInventory").addEventListener("click", function () { showView("inventoryView"); });
  $("navAlerts").addEventListener("click", function () { showView("alertsView"); });
  $("navSettings").addEventListener("click", function () { showView("settingsView"); });
  $("refreshApp").addEventListener("click", function () { if (currentHouseholdId) loadFood(currentHouseholdId); });

  $("addFood").addEventListener("click", openFoodModal);
  $("addFood2").addEventListener("click", openFoodModal);

  $("closeFood").addEventListener("click", function () {
    $("foodModal").classList.add("hidden");
  });

  $("foodForm").addEventListener("submit", async function (event) {
    event.preventDefault();
    if (!sb || !currentHouseholdId) {
      $("foodMsg").textContent = "Your household is not ready yet. Please refresh and try again.";
      return;
    }

    var saveButton = event.submitter;
    saveButton.disabled = true;
    $("foodMsg").textContent = "Saving...";

    var row = {
      household_id: currentHouseholdId,
      name: $("foodName").value.trim(),
      brand: $("foodBrand").value.trim() || null,
      quantity: Number($("foodQty").value),
      unit: $("foodUnit").value,
      low_at: Number($("foodLow").value),
      expiration: $("foodExpiration").value || null,
      location: $("foodLocation").value,
      category: $("foodCategory").value,
      notes: $("foodNotes").value.trim() || null
    };

    var result = await sb.from("food_items").insert(row);
    saveButton.disabled = false;

    if (result.error) {
      $("foodMsg").textContent = result.error.message;
      return;
    }

    $("foodForm").reset();
    $("foodQty").value = "1";
    $("foodLow").value = "1";
    $("foodMsg").textContent = "";
    $("foodModal").classList.add("hidden");
    await loadFood(currentHouseholdId);
  });

  function escapeHtml(value) {
    return String(value == null ? "" : value).replace(/[&<>"']/g, function (c) {
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }

  start().catch(function (error) {
    showMessage(error.message || "Unable to start authentication.");
  });
}());
</script>
</body>
</html>
