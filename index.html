<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kitchen Keeper</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7f5;color:#17221b}
button,input,select,textarea{font:inherit}button{cursor:pointer}
header{padding:24px;background:#183b29;color:white}h1{margin:0 0 6px}.wrap{max-width:1050px;margin:auto;padding:24px}
.auth{max-width:430px;margin:50px auto;background:white;padding:28px;border-radius:16px;box-shadow:0 8px 30px #0001}
.tabs{display:flex;gap:8px;margin-bottom:20px}.tabs button{flex:1;padding:12px;border:0;border-radius:9px;background:#e8eee9}.tabs button.active{background:#2f7d4b;color:white}
input,select,textarea{width:100%;padding:11px;border:1px solid #ccd6ce;border-radius:8px;margin:6px 0 14px;background:white}
.primary{background:#2f7d4b;color:white;border:0;padding:12px 18px;border-radius:9px}.secondary{background:#e8eee9;border:0;padding:12px 18px;border-radius:9px}
.msg{min-height:22px;margin:8px 0;color:#b42318}.hidden{display:none!important}
.appnav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.appnav button{border:0;padding:10px 14px;border-radius:8px;background:#e8eee9}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:white;padding:18px;border-radius:12px}.card b{font-size:28px}
.panel{background:white;padding:20px;border-radius:14px;margin-top:18px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.food{padding:14px 0;border-bottom:1px solid #e4e9e5}
@media(max-width:700px){.cards{grid-template-columns:repeat(2,1fr)}.wrap{padding:15px}}
</style>
</head>
<body>
<header><div class="wrap"><h1>🥕 Kitchen Keeper</h1><div>Shared household food inventory</div></div></header>

<section id="auth" class="auth">
  <div class="tabs">
    <button id="signInTab" class="active" type="button">Sign in</button>
    <button id="signUpTab" type="button">Create account</button>
  </div>
  <form id="authForm">
    <label>Email</label>
    <input id="email" type="email" required autocomplete="email">
    <label>Password</label>
    <input id="password" type="password" required minlength="6" autocomplete="current-password">
    <button id="authButton" class="primary" type="submit">Sign in</button>
  </form>
  <div id="authMsg" class="msg"></div>
</section>

<section id="app" class="wrap hidden">
  <div class="row">
    <h2>Kitchen Keeper</h2>
    <button id="signOut" class="secondary" type="button">Sign out</button>
  </div>
  <div class="appnav">
    <button type="button">Dashboard</button><button type="button">Inventory</button><button type="button">Alerts</button><button type="button">Settings</button>
  </div>
  <div id="householdSetup" class="panel">
    <h2>Set up your household</h2>
    <p>Create a household or join one with an invite code.</p>
    <label>Household name</label><input id="houseName" value="My Kitchen">
    <button id="createHouse" class="primary" type="button">Create household</button>
    <hr>
    <label>Invite code</label><input id="inviteCode" maxlength="8" placeholder="8-character code">
    <button id="joinHouse" class="secondary" type="button">Join household</button>
    <div id="houseMsg" class="msg"></div>
  </div>
  <div id="dashboard" class="hidden">
    <div class="cards">
      <div class="card">Total items<br><b id="total">0</b></div>
      <div class="card">Low stock<br><b id="low">0</b></div>
      <div class="card">Expiring soon<br><b id="soon">0</b></div>
      <div class="card">Expired<br><b id="expired">0</b></div>
    </div>
    <div class="panel">
      <div class="row"><h2>Inventory</h2><button id="addFood" class="primary" type="button">＋ Add food</button></div>
      <div id="inventory"></div>
    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  "use strict";

  var SUPABASE_URL = "https://gprlzbgcpsmqofpjyase.supabase.co";
  var SUPABASE_KEY = "sb_publishable__4rtFjMMNlRD8D5UY7LSGQ_njJd9G-x";
  var sb = null;
  var mode = "signin";

  var $ = function (id) { return document.getElementById(id); };

  function setMode(next) {
    mode = next;
    $("signInTab").classList.toggle("active", mode === "signin");
    $("signUpTab").classList.toggle("active", mode === "signup");
    $("authButton").textContent = mode === "signin" ? "Sign in" : "Create account";
    $("authMsg").textContent = "";
  }

  $("signInTab").addEventListener("click", function () { setMode("signin"); });
  $("signUpTab").addEventListener("click", function () { setMode("signup"); });

  function showMessage(text) {
    $("authMsg").textContent = text;
  }

  async function start() {
    if (!window.supabase) {
      showMessage("The authentication library did not load. Please refresh the page.");
      return;
    }
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    var result = await sb.auth.getSession();
    if (result.data && result.data.session) {
      showApp();
    }
  }

  $("authForm").addEventListener("submit", async function (event) {
    event.preventDefault();
    if (!sb) {
      showMessage("Connecting to authentication. Please wait a moment and try again.");
      await start();
      if (!sb) return;
    }

    var email = $("email").value.trim();
    var password = $("password").value;
    $("authButton").disabled = true;
    showMessage("Please wait...");

    var result;
    if (mode === "signup") {
      result = await sb.auth.signUp({ email: email, password: password });
    } else {
      result = await sb.auth.signInWithPassword({ email: email, password: password });
    }

    $("authButton").disabled = false;

    if (result.error) {
      showMessage(result.error.message);
      return;
    }

    if (mode === "signup" && !result.data.session) {
      showMessage("Account created. Check your email to confirm your account.");
      return;
    }

    showMessage("");
    showApp();
  });

  $("signOut").addEventListener("click", async function () {
    if (sb) await sb.auth.signOut();
    $("app").classList.add("hidden");
    $("auth").classList.remove("hidden");
  });

  async function showApp() {
    $("auth").classList.add("hidden");
    $("app").classList.remove("hidden");
    await checkHousehold();
  }

  async function checkHousehold() {
    if (!sb) return;
    var result = await sb.from("household_members").select("household_id").limit(1);
    if (result.error || !result.data || result.data.length === 0) {
      $("householdSetup").classList.remove("hidden");
      $("dashboard").classList.add("hidden");
      return;
    }
    $("householdSetup").classList.add("hidden");
    $("dashboard").classList.remove("hidden");
    loadFood(result.data[0].household_id);
  }

  $("createHouse").addEventListener("click", async function () {
    if (!sb) return;
    var name = $("houseName").value.trim() || "My Kitchen";
    var result = await sb.rpc("create_household", { hname: name });
    if (result.error) {
      $("houseMsg").textContent = result.error.message;
      return;
    }
    $("houseMsg").textContent = "Household created.";
    await checkHousehold();
  });

  $("joinHouse").addEventListener("click", async function () {
    if (!sb) return;
    var code = $("inviteCode").value.trim();
    var result = await sb.rpc("join_household", { invite: code });
    if (result.error) {
      $("houseMsg").textContent = result.error.message;
      return;
    }
    $("houseMsg").textContent = "Joined household.";
    await checkHousehold();
  });

  async function loadFood(householdId) {
    var result = await sb.from("food_items").select("*").eq("household_id", householdId).order("expiration", { ascending: true });
    if (result.error) return;
    var items = result.data || [];
    $("total").textContent = items.length;
    $("low").textContent = items.filter(function (x) { return Number(x.quantity) <= Number(x.low_at); }).length;
    var today = new Date();
    var soonDate = new Date();
    soonDate.setDate(today.getDate() + 7);
    $("expired").textContent = items.filter(function (x) { return x.expiration && new Date(x.expiration) < today; }).length;
    $("soon").textContent = items.filter(function (x) { var d = x.expiration ? new Date(x.expiration) : null; return d && d >= today && d <= soonDate; }).length;
    $("inventory").innerHTML = items.map(function (x) {
      return '<div class="food"><b>' + escapeHtml(x.name) + '</b> — ' + escapeHtml(x.quantity) + ' ' + escapeHtml(x.unit || "") + '<br><small>' + escapeHtml(x.location || "") + ' · expires ' + escapeHtml(x.expiration || "none") + '</small></div>';
    }).join("");
  }

  function escapeHtml(value) {
    return String(value == null ? "" : value).replace(/[&<>"']/g, function (c) {
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }

  $("addFood").addEventListener("click", function () {
    alert("Food entry form will be added after authentication is confirmed working.");
  });

  start().catch(function (error) {
    showMessage(error.message || "Unable to start authentication.");
  });
}());
</script>
</body>
</html>
